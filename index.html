<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="組織管理">
<meta name="theme-color" content="#0b0b0b">
<title>組織管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --navy: #14315c;
    --navy-soft: #e8eff8;
    --line: #c5cedc;
    --orange: #b96a12;
    --orange-soft: #fdf1e3;
    --green: #17907d;
    --green-soft: #e0f4f0;
    --red: #b3403a;
    --red-soft: #f8e4e4;
    --text: #1d2939;
    --muted: #667085;
    --bg: #f5f7fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  header { background: linear-gradient(180deg, #161616, #0b0b0b); color: #efe4c4; padding: 18px 16px; border-bottom: 2px solid #b8892b; }
  header h1 { background: linear-gradient(180deg, #fff3c4 0%, #ecc65c 48%, #b8892b 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header .in { max-width: 1100px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
  header h1 .who { display: inline-block; margin-left: 12px; font-size: 15px; font-weight: 700; color: #efe4c4; -webkit-text-fill-color: #efe4c4; vertical-align: 2px; }
  header h1 .who:empty { display: none; }
  header .side { font-size: 12px; opacity: .85; text-align: right; }
  header .side button { margin-left: 8px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .panel { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(20, 49, 92, .12); min-width: 0; }
  /* 画面の幅より広がらないように（スマホで一度広がると、ほかのページも横にはみ出したままになるため） */
  html { overflow-x: hidden; }
  body { max-width: 100%; overflow-x: clip; } /* clip は横スクロールの箱を作らないので、詳細の追従（sticky）が効いたまま */
  .panel h2 { margin: 0 0 10px; font-size: 16px; color: var(--navy); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .panel h2 small { font-size: 12px; color: var(--muted); font-weight: 400; }
  button, select, input { font: inherit; color: var(--text); }
  input, select, textarea { font-size: 16px; } /* iPhone は16pxより小さい入力欄を押すと画面を拡大して、そのまま戻らないため */
  button {
    cursor: pointer; border: 1px solid var(--navy); background: #fff; color: var(--navy);
    border-radius: 999px; padding: 4px 14px;
  }
  button:hover { background: var(--navy-soft); }
  button.main { background: var(--navy); color: #fff; }
  button.ghost { border-color: var(--line); color: var(--muted); }
  button.mini { padding: 1px 10px; font-size: 12px; }
  input[type="text"], input[type="email"], input[type="search"], select {
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%;
  }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; gap: 10px; margin-bottom: 12px; }
  .tile { background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(20, 49, 92, .12); }
  .tile .lbl { font-size: 12px; color: var(--muted); }
  .tile .val { font-size: 26px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; line-height: 1.3; }
  .tile .val small { font-size: 13px; font-weight: 600; margin-left: 2px; }
  .tile .sub { font-size: 12px; color: var(--muted); }
  .tile[data-go] { cursor: pointer; }
  .tile[data-go]:hover { box-shadow: 0 0 0 2px var(--navy-soft); }
  .tile .sub[data-go] { cursor: pointer; text-decoration: underline; color: var(--orange); }

  .focus {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: var(--navy-soft); border-radius: 12px; padding: 8px 14px; margin-bottom: 12px;
  }
  .focus b { color: var(--navy); }
  .kubun { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .kubun button { border-color: var(--line); border-radius: 10px; min-width: 38px; padding: 4px 10px; font-weight: 700; color: var(--text); }
  .kubun button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .tools { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .tools input { flex: 1 1 220px; }
  .tabs { display: flex; gap: 4px; background: #e3e9f2; border-radius: 12px; padding: 4px; margin-bottom: 12px; overflow-x: auto; }
  .tabs button { border: none; background: transparent; color: var(--muted); border-radius: 9px; padding: 6px 14px; white-space: nowrap; font-weight: 600; }
  .tabs button.on { background: #fff; color: var(--navy); box-shadow: 0 1px 2px rgba(20, 49, 92, .15); }
  .tabs .n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--orange-soft); color: var(--orange); font-size: 12px; }

  .cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  #detail { position: sticky; top: 12px; }
  .empty { color: var(--muted); padding: 12px 0; }

  /* 組織図（階層リスト） */
  .tree, .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree { overflow-x: auto; padding-bottom: 4px; } /* 階層が深いときは、この枠の中だけ横にスクロール */
  .tree .row { min-width: 170px; }
  .tree ul { margin-left: 13px; padding-left: 13px; border-left: 2px solid var(--line); }
  .tree li { margin-top: 6px; }
  .node { display: flex; align-items: stretch; gap: 6px; }
  .tog {
    flex: 0 0 26px; border: 1px solid var(--line); border-radius: 8px; padding: 0; color: var(--muted);
    font-size: 12px; background: #fff;
  }
  .tog.none { visibility: hidden; }
  .row {
    flex: 1; min-width: 0; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px;
    background: #fff; color: var(--text); display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .row:hover { background: #f8fafd; }
  .row.sel { border-color: var(--green); box-shadow: 0 0 0 2px var(--green-soft); }
  .row.me { background: var(--navy-soft); }
  .row .left { flex: 1 1 auto; min-width: 0; }
  .row .nm { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .right { text-align: right; flex: 0 0 auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .list .row { margin-top: 6px; width: 100%; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 8px; vertical-align: middle; }
  .badge.lv { background: var(--navy); color: #fff; }
  .badge.ok { background: var(--green-soft); color: var(--green); }
  .badge.ng { background: var(--red-soft); color: var(--red); }
  .badge.wait { background: var(--orange-soft); color: var(--orange); }

  /* 組織図（図で見る） */
  .cols.wide { grid-template-columns: minmax(0, 1fr); }
  .cols.wide #detail { position: static; }
  .chartwrap { overflow: auto; padding: 4px 0 12px; }
  .chart, .chart ul { list-style: none; margin: 0; padding: 0; }
  .chart { display: inline-flex; min-width: 100%; justify-content: center; }
  .chart ul { display: flex; justify-content: center; padding-top: 20px; position: relative; }
  .chart li { position: relative; padding: 20px 6px 0; display: flex; flex-direction: column; align-items: center; }
  .chart > li { padding-top: 0; }
  .chart ul::before { content: ""; position: absolute; top: 0; left: 50%; height: 20px; border-left: 2px solid var(--line); }
  .chart ul > li::before, .chart ul > li::after { content: ""; position: absolute; top: 0; width: 50%; height: 20px; border-top: 2px solid var(--line); }
  .chart ul > li::before { right: 50%; }
  .chart ul > li::after { left: 50%; border-left: 2px solid var(--line); }
  .chart ul > li:first-child::before, .chart ul > li:last-child::after { border-top: none; }
  .chart ul > li:only-child::before { display: none; }
  .chart ul > li:only-child::after { border-top: none; }
  .cnode {
    width: 184px; text-align: left; border: 1px solid var(--line); border-left: 5px solid var(--green); border-radius: 12px;
    padding: 8px 10px; background: #fff; color: var(--text); display: flex; gap: 8px; align-items: flex-start;
    box-shadow: 0 1px 3px rgba(20, 49, 92, .1);
  }
  .cnode:hover { background: #f8fafd; }
  .cnode svg { flex: 0 0 18px; margin-top: 3px; color: var(--green); }
  .cnode .b { min-width: 0; flex: 1; }
  .cnode .nm { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cnode .meta { display: block; font-size: 12px; color: var(--muted); }
  .cnode .st { display: block; font-size: 12px; font-weight: 700; margin-top: 2px; }
  .cnode.me { background: var(--navy-soft); border-left-color: var(--navy); }
  .cnode.me svg { color: var(--navy); }
  .cnode.off { background: #f1f3f6; border-left-color: #aab2bf; }
  .cnode.off .nm, .cnode.off svg { color: var(--muted); }
  .cnode.sel { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .ctog { margin-top: 4px; border-color: var(--line); color: var(--muted); font-size: 12px; padding: 0 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; color: var(--muted); padding: 2px 12px; font-size: 12px; }
  .seg button.on { background: var(--navy); color: #fff; }
  .treebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }

  dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 12px; }
  dl.kv dt { color: var(--muted); font-size: 13px; white-space: nowrap; }
  dl.kv dd { margin: 0; font-weight: 600; }
  .bar { height: 8px; background: #e3e9f2; border-radius: 999px; overflow: hidden; margin: 4px 0 2px; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .muted { color: var(--muted); font-weight: 400; }
  .note { background: var(--green-soft); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
  h3 { font-size: 14px; color: var(--navy); margin: 14px 0 4px; }
  table.hist { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 6px; }
  table.hist th { color: var(--muted); font-weight: 400; font-size: 12px; text-align: left; padding: 4px; border-bottom: 1px solid var(--line); }
  table.hist td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.hist .d { width: 1%; white-space: nowrap; color: var(--muted); }
  table.hist .n { width: 1%; text-align: right; white-space: nowrap; }
  table.hist .p { color: var(--orange); font-weight: 700; }
  table.hist small { display: block; color: var(--muted); font-weight: 400; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #e3e9f2; padding: 7px 8px; text-align: right; font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; }
  td.l, th.l { text-align: left; }
  tr.pick { cursor: pointer; }
  tr.pick:hover td { background: #f8fafd; }
  tr.on td { background: var(--green-soft); }
  footer { max-width: 1100px; margin: 0 auto; padding: 4px 16px 30px; color: var(--muted); font-size: 12px; text-align: center; }

  /* ログイン */
  .login { max-width: 420px; margin: 40px auto; }
  .login label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .login .act { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .login .err { color: var(--red); margin-top: 10px; min-height: 1.6em; }

  /* 下のタブ（PCでは上に横ならび） */
  .nav { display: flex; gap: 4px; background: #fff; border-radius: 14px; padding: 4px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(20, 49, 92, .12); }
  .nav button { flex: 1; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 4px; color: var(--muted); font-weight: 700; }
  .nav button svg { flex: 0 0 20px; }
  .nav button.on { background: var(--navy-soft); color: var(--navy); }
  .nav .n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--orange-soft); color: var(--orange); font-size: 11px; line-height: 18px; }

  /* ホーム：レベルのカード（小さめ） */
  .lvcard { padding: 12px 14px; margin-bottom: 12px; }
  .lvcard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .lvcard .ttl { font-size: 16px; font-weight: 700; color: var(--navy); }
  .lvcard .ttl .to { font-size: 13px; color: var(--muted); font-weight: 600; }
  .lvcard .big { font-size: 22px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
  .lvcard .big small { font-size: 13px; font-weight: 700; margin-left: 2px; }
  .lvbar { height: 8px; background: #e3e9f2; border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
  .lvbar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #8db8e3, var(--navy)); }
  .lvneed { font-size: 13px; }
  .lvneed b { color: var(--navy); font-size: 15px; }
  .lvsub { font-size: 12px; color: var(--muted); }
  .lvsub b { color: var(--orange); font-size: 12px; }
  .ladder { display: flex; gap: 3px; margin: 8px 0 4px; }
  .ladder span { flex: 1; text-align: center; font-size: 11px; padding: 1px 0; border-radius: 6px; background: #eef2f7; color: var(--muted); }
  .ladder span.done { background: var(--navy-soft); color: var(--navy); }
  .ladder span.now { background: var(--navy); color: #fff; font-weight: 700; }
  .lvfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .asof { font-size: 11px; color: var(--muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid #e3e9f2; }
  .linkbtn { border: none; padding: 0; background: none; color: var(--navy); font-weight: 700; text-decoration: underline; font-size: 12px; }
  .linkbtn:hover { background: none; }
  .rwcard { padding: 20px; margin-bottom: 12px; }
  /* 金と黒（アイコンの色）：見込み報酬・レベル・ポイント */
  .hero { background: radial-gradient(130% 150% at 0% 0%, #2b2410 0%, #141414 48%, #0b0b0b 100%); border: 1px solid rgba(212, 175, 55, .5);
    border-radius: 16px; padding: 16px; color: #efe4c4; margin-bottom: 14px; box-shadow: 0 6px 18px rgba(0, 0, 0, .22); }
  .gold { background: linear-gradient(180deg, #fff3c4 0%, #ecc65c 48%, #b8892b 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .lbl { font-size: 12px; color: #cdb983; }
  .hero .sub { font-size: 12px; color: #b9aa83; margin-top: 2px; }
  .hero .big { font-size: 42px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .hero [data-go], .hero [data-page] { cursor: pointer; }
  .hnext { margin-top: 10px; width: 100%; text-align: left; border: 1px solid rgba(212, 175, 55, .35); border-radius: 10px; background: rgba(255, 255, 255, .04);
    color: #cdb983; font-size: 13px; padding: 7px 12px; }
  .hnext:hover { background: rgba(212, 175, 55, .1); }
  .hnext b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .hrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; gap: 10px; margin-top: 12px; }
  .hbox { background: rgba(255, 255, 255, .04); border: 1px solid rgba(212, 175, 55, .28); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .lvnum { font-size: 30px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .lvnum small { font-size: 14px; margin-left: 2px; }
  .gbar { height: 6px; background: rgba(255, 255, 255, .12); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
  .gbar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #a87b26, #f6e08f); }
  .glad { display: flex; gap: 2px; margin-top: 6px; }
  .glad span { flex: 1; text-align: center; font-size: 10px; border-radius: 4px; padding: 1px 0; background: rgba(255, 255, 255, .06); color: #85795a; }
  .glad span.done { background: rgba(212, 175, 55, .2); color: #e7c460; }
  .glad span.now { background: linear-gradient(180deg, #f6e08f, #c4952f); color: #1b1407; font-weight: 800; }
  .hfoot { font-size: 11px; color: #9a8d6c; margin-top: 10px; }
  .rwcard.hero .lvsub, .rwcard.hero .asof { color: #b9aa83; border-color: rgba(212, 175, 55, .2); }
  .rwcard.hero .yen { color: #cdb983; }
  .rwcard.hero .rwsplit div { background: rgba(255, 255, 255, .05); border: 1px solid rgba(212, 175, 55, .22); }
  .rwcard.hero .rwsplit .lbl { color: #b9aa83; }
  .rwcard.hero .rwsplit b, .rwcard.hero .lvneed b { color: #ecc65c; }
  .rwcard.hero .lvneed { color: #efe4c4; }
  .calc { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .calch { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .calch b { color: var(--navy); font-size: 18px; font-variant-numeric: tabular-nums; }
  .calc dl.kv { margin-bottom: 8px; }
  .calcf { border-top: 1px dashed var(--line); padding-top: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .rwcard .big { font-size: 40px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .rwcard .yen { font-size: 15px; color: var(--muted); font-weight: 600; }
  .rwsplit { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  .rwsplit div { background: #f3f6fa; border-radius: 10px; padding: 8px 10px; }
  .rwsplit .lbl { font-size: 12px; color: var(--muted); }
  .rwsplit b { display: block; font-size: 16px; color: var(--navy); }
  .alert { border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
  .alert.ng { background: var(--red-soft); color: var(--red); }
  .alert.hold { background: var(--orange-soft); color: var(--orange); }
  .alert b { display: block; margin-bottom: 2px; }
  .badge.role { background: #eef2f7; color: var(--navy); }
  .badge.new { background: var(--green-soft); color: var(--green); }
  .sec { margin: 4px 2px 8px; font-size: 16px; font-weight: 700; color: var(--navy); }

  /* 代理店区分ごとの支払い見込み */
  table.pay td.l, table.pay th.l { text-align: left; }
  table.pay tr.pick { cursor: pointer; }
  table.pay tr.pick:hover, table.pay tr.on { background: var(--navy-soft); }
  table.pay tr.tot td { font-weight: 700; border-top: 2px solid var(--line); }
  table.pay td, table.pay th { white-space: nowrap; }
  /* 確認の小窓（会社のコミッション） */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(11, 11, 11, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal .box { background: #fff; border-radius: 14px; padding: 18px; max-width: 420px; width: 100%; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
  .modal h2 { margin: 0 0 8px; font-size: 16px; color: var(--red); }
  .modal p { margin: 0 0 10px; font-size: 14px; }
  .modal .err { color: var(--red); min-height: 1.4em; }
  .modal .act { display: flex; gap: 8px; justify-content: flex-end; }
  /* トップへ戻る（下にスクロールしたときだけ出る） */
  .totop { position: fixed; right: 18px; bottom: 22px; z-index: 30; border: none; border-radius: 999px; background: var(--navy); color: #fff;
    padding: 10px 16px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 12px rgba(20, 49, 92, .3); display: flex; align-items: center; gap: 6px;
    opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .2s, transform .2s; }
  .totop.show { opacity: 1; pointer-events: auto; transform: none; }
  @media (max-width: 760px) {
    .totop { bottom: calc(78px + env(safe-area-inset-bottom)); right: 12px; }
    .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; margin: 0; border-radius: 0; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));

  else if (d.agent) S.sel = { type: 'agent', id: d.agent };
  else if (d.contract) { if (!S.sel || S.sel.type !== 'contract') S.back = S.sel; S.sel = { type: 'contract', id: Number(d.contract) }; }
  else if (d.act === 'back') { S.sel = S.back || { type: 'agent', id: S.focus }; S.back = null; } // 契約を開く前に見ていた人へ戻る
  else if ('kubun' in d) {
    var tops = d.kubun ? kubunTops(d.kubun) : [];
    S.kubun = d.kubun; S.focus = tops[0] || D.me; S.open[S.focus] = true; S.q = '';
    S.sel = { type: 'agent', id: S.focus };
  }
  else if (d.focus) { S.focus = d.focus; S.open[d.focus] = true; S.page = 'org'; S.tab = 'tree'; S.q = ''; }
  else if (d.month) { S.month = d.month; S.tab = 'contracts'; }
  else if (/^reward\d$/.test(d.go || '')) { goPage('reward'); S.rwMonth = Number(d.go.slice(6)); }
  else if (d.go === 'own' || d.go === 'ownwait') { // 本人が紹介した契約（紹介者の代理店コードで絞る）
    goPage('customers'); S.tab = d.go === 'own' ? 'contracts' : 'wait'; S.q = S.focus;
  }
  else if (d.go) {
    goPage(d.go === 'tree' ? 'org' : 'customers');
    S.tab = d.go; S.month = '';
  }
  else if (d.act === 'home') { S.kubun = ''; S.focus = D.me; S.sel = { type: 'agent', id: D.me }; }
  else if (d.act === 'openall') [S.focus].concat(under(S.focus)).forEach(function (c) { S.open[c] = true; });
  else if (d.act === 'closeall') { S.open = {}; S.open[S.focus] = true; }
  else if (d.act === 'allmonth') S.month = '';
  else if (d.act === 'hist') S.histAll = S.histAll === S.sel.id ? '' : S.sel.id;
  var wrap = document.querySelector('.chartwrap'), sx = wrap ? wrap.scrollLeft : 0;
  render();
  wrap = document.querySelector('.chartwrap');
  if (wrap) wrap.scrollLeft = sx;
  if (d.go || d.page || d.rwagent || d.act === 'hideco') window.scrollTo(0, 0);
  var pd = d.paykubun && document.getElementById('paydetail'); // 区分を押したら、その詳細へ
  if (pd) pd.scrollIntoView({ behavior: 'smooth', block: 'start' });
  var det = document.getElementById('detail');
  if (det && (d.agent || d.contract || d.act === 'back') && (S.page === 'reward' || isChart() || window.matchMedia('(max-width: 760px)').matches)) {
    det.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});
function goPage(p) {
  S.page = p; S.q = ''; S.month = '';
  if (p === 'reward' && S.sel && S.sel.type === 'contract') { S.sel = null; S.back = null; } // 報酬のページは契約を押したときだけ詳細を出す
  if (PAGE_TABS[p] && PAGE_TABS[p].indexOf(S.tab) === -1) S.tab = PAGE_TABS[p][0];
}
// 検索：入力欄は作り直さず、左の一覧だけ書き直す（日本語の変換中は待つ）
function onSearch(e) {
  if (e.target.id !== 'q' || e.isComposing) return;
  S.q = e.target.value.trim();
  if (!document.getElementById('left')) return;
  var scope = [S.focus].concat(under(S.focus)), cons = contractsOf(scope);
  document.getElementById('left').innerHTML = leftPanel(scope, cons);
}
document.getElementById('app').addEventListener('input', onSearch);
// トップへ戻る：少し下にスクロールしたら出す
(function () {
  var b = document.getElementById('totop');
  var upd = function () { b.classList.toggle('show', window.scrollY > 400); };
  window.addEventListener('scroll', upd, { passive: true });
  b.addEventListener('click', function () {
    var y0 = window.scrollY;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setTimeout(function () { if (window.scrollY >= y0) window.scrollTo(0, 0); }, 700); // 滑らかに動かない端末では、そのまま上へ
  });
  upd();
})();
document.getElementById('app').addEventListener('compositionend', onSearch);

start();
</script>
